# This project runs as scripts (see run.sh / src/main.py), not as an
# installed package, so no [build-system] table is declared here - this file
# exists purely as a PEP 621 dependency manifest, replacing requirements.txt.

[project]
name = "tool-chip-contact-length"
version = "0.1.0"
description = "Computer-vision pipeline that measures Tool-Chip Contact Length from high-speed camera images."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python",
    "numpy",
]

[project.urls]
Repository = "https://github.com/FrunzaDan/Tool-Chip_Contact_Length"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Ruff is both the linter and the formatter (`ruff check`, `ruff format`).
[tool.ruff]
src = ["src"]  # so `import folder_loop` etc. are sorted as first-party

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort (import order)
    "N",       # pep8-naming
    "D",       # pydocstyle (PEP 257 docstrings)
    "UP",      # pyupgrade (modern syntax for the target Python)
    "B",       # flake8-bugbear
    "SIM",     # flake8-simplify
    "BLE",     # blind `except Exception` must log a traceback or re-raise
    "G",       # logging: lazy %-args, not f-strings
    "PTH",     # pathlib instead of os.path
    "S",       # flake8-bandit (security)
    "C4",      # flake8-comprehensions
    "PIE",     # flake8-pie (redundant code)
    "PERF",    # perflint (slow loop patterns)
    "NPY",     # NumPy-specific rules (deprecated APIs, legacy random)
    "PT",      # flake8-pytest-style
    "RET",     # flake8-return
    "ARG",     # unused arguments
    "PLE",     # pylint errors
    "PLW",     # pylint warnings
    "RUF",     # Ruff's own rules
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Test names describe the behavior, so docstrings aren't required; pytest
# checks with `assert`, and monkeypatched stand-ins ignore their arguments.
"tests/*" = ["D", "S101", "ARG"]
"src/random_color.py" = ["S311"]  # annotation colors, not cryptography

[tool.mypy]
files = ["src"]
strict = true
